<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alexander Biddle | Cybersecurity Specialist &amp; Developer</title>
    <!--
      GitHub Pages has no SPA fallback: a refresh on /Skills serves this 404 page. It re-encodes the
      requested path into a query string and redirects to the site root, where the shim in index.html
      decodes it back into a clean URL before React Router boots. pathSegmentsToKeep = 1 preserves the
      project-page base segment (/Alex-Biddle-Portfolio-Website).
    -->
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
