<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- GitHub Pages SPA shim: 404.html redirects a deep link here with the route encoded in the query
         string; this restores the real path before React Router boots so clean URLs survive a refresh. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>

    <!-- Viewport metadata keeps the React-rendered DOM responsive on mobile and desktop. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Website Title -->
    <title>Alexander Biddle | Cybersecurity Specialist & Developer</title>

    <!-- Character encoding and description metadata help the browser parse and describe the page. -->
    <meta charset="UTF-8" />
    <meta name="description" content="Cybersecurity specialist and developer portfolio for Alexander Biddle." />
    
    <!-- Css Style Link: global styles shape the DOM that React mounts into #root. -->
    <link rel="stylesheet" href="./src/index.css">

    <!-- Font Style Link: Font Awesome provides icon classes used by React components. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Image for Website Img Link -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%images/fav.png" />

    <!-- Bootstrap Links: optional framework CSS/JS available to any DOM components that use it. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </head>
  
  <body>
    <!-- React takes ownership of this root node and renders the app's route DOM inside it. -->
    <div id="root"></div>
    <!-- Module script starts the React app by executing src/main.tsx. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>

  
</html>
