<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding is declared first so the parser never has to re-decode the document. -->
    <meta charset="UTF-8" />

    <!-- Minimal CSP that is safe for both the Vite dev server and the static GitHub Pages build:
         it forbids plugin/object embedding and <base> tag hijacking without restricting the
         framework's inline styles or the dev-server HMR preamble. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />

    <!-- GitHub Pages SPA shim: 404.html redirects a deep link here with the route encoded in the query
         string; this restores the real path before React Router boots so clean URLs survive a refresh. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>

    <!-- Viewport metadata keeps the React-rendered DOM responsive on mobile and desktop. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Title -->
    <title>Alexander Biddle | Cybersecurity Specialist & Developer</title>

    <!-- Description metadata helps search engines and link previews describe the page. -->
    <meta name="description" content="Cybersecurity specialist and developer portfolio for Alexander Biddle." />

    <!-- Font Style Link: Font Awesome provides icon classes used by React components.
         Subresource integrity pins the exact stylesheet bytes so a compromised CDN cannot
         silently serve altered content. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Image for Website Img Link -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%2300111c'/><rect x='1' y='1' width='62' height='62' rx='9' fill='none' stroke='%230087e8' stroke-width='1.5' opacity='.8'/><text x='32' y='41' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-size='26' font-weight='700' fill='white'>AB</text><rect x='22' y='47' width='20' height='2.5' rx='1.25' fill='%230087e8'/></svg>" />
  </head>
  
  <body>
    <!-- React takes ownership of this root node and renders the app's route DOM inside it. -->
    <div id="root"></div>
    <!-- Module script starts the React app by executing src/main.tsx. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>

  
</html>
